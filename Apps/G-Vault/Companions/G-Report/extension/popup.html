<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rutgers Integrity Form Helper</title><link rel="stylesheet" href="popup.css"></head><body><h1>Integrity form helper</h1><p>Choose a reporting JSON exported by your local Casebook. Nothing is submitted automatically.</p><label>Reporting file<input id="file" type="file" accept=".json,application/json"></label><section id="summary" hidden><h2 id="student"></h2><p id="case"></p><p id="letter"></p><ul id="warnings"></ul><label class="check"><input id="confirm" type="checkbox">This is the student whose form I want to fill.</label><label class="check"><input id="overwrite" type="checkbox">Replace different answers already on the page.</label><label class="check"><input id="attach" type="checkbox" disabled>I authorize attaching this student’s linked outcome PDF to the Rutgers form (this may upload it immediately).</label><p id="attachment-help" class="small"></p><button id="fill" disabled>Fill form</button></section><p id="status" role="status"></p><p class="small">You must review all answers and attachments, add any other required files, and click Submit yourself. Closing this popup discards the loaded data.</p><script src="page-fill.js"></script><script src="popup.js"></script></body></html>
