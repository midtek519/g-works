<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extension setup</title>
  <link rel="stylesheet" href="g-extension-setup.css">
  <script src="g-extension-setup.js" defer></script>
</head>
<body>
  <main>
    <h1 id="name">Extension setup</h1>
    <p id="status" role="status">Connecting to Chrome…</p>
    <button id="reload" hidden>Reload extension</button>
    <button id="manager">Chrome extensions</button>
    <p class="help">Reload keeps your saved extension settings. Refresh open pages where you use the extension.</p>
  </main>
</body>
</html>
